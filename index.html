<html lang="en">
<head>

  <title>ETB USDT P2P</title>
<link rel="stylesheet" href="compact.css">
  <style>

      margin: 0;
      padding: 0;

    }

    body {
      background: #0f172a;
      color: #ffffff;

    }

    .app {
      max-width: 500px;
      margin: auto;
    }

    .header {
      padding: 22px 18px 15px;
      background: #111827;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid #253047;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
    }

    .demo {
      background: #f59e0b;
      color: #111827;
      font-size: 11px;
      font-weight: bold;
      padding: 5px 10px;
      border-radius: 20px;
    }

    .subtitle {
      color: #94a3b8;
      margin-top: 5px;
      font-size: 13px;
    }

    .balance-card {
      margin: 16px;
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      border-radius: 20px;
      padding: 20px;
    }

    .balance-label {
      font-size: 13px;
      opacity: 0.8;
    }

    .balance {
      font-size: 30px;
      font-weight: bold;
      margin-top: 8px;
    }

    .etb-balance {
      margin-top: 5px;
      opacity: 0.85;
      font-size: 14px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .action-btn {
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    .buy-btn {
      background: #22c55e;
      color: white;
    }

    .sell-btn {
      background: #ef4444;
      color: white;
    }

    .section {
      padding: 8px 16px;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin: 14px 0;
    }

    .rate-card {
      background: #111827;
      border: 1px solid #243244;
      padding: 15px;
      border-radius: 16px;
      margin-bottom: 16px;
    }

    .rate-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .rate-label {
      color: #94a3b8;
      font-size: 13px;
    }

    .rate-value {
      font-size: 18px;
      font-weight: bold;
      margin-top: 5px;
    }

    .online {
      color: #22c55e;
      font-size: 12px;
    }

    .tabs {
      background: #111827;
      padding: 5px;
      border-radius: 13px;
      display: flex;
      margin-bottom: 15px;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      color: #94a3b8;
    }

    .tab.active {
      background: #2563eb;
      color: white;
      font-weight: bold;
    }

    .offer {
      background: #111827;
      border: 1px solid #243244;
      padding: 16px;
      border-radius: 17px;
      margin-bottom: 12px;
    }

    .seller {
      display: flex;
      justify-content: space-between;
      margin-bottom: 13px;
    }

    .seller-name {
      font-weight: bold;
    }

    .verified {
      color: #38bdf8;
    }

    .trades {
      color: #94a3b8;
      font-size: 12px;
      margin-top: 4px;
    }

    .offer-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .small-label {
      color: #94a3b8;
      font-size: 12px;
    }

    .value {
      margin-top: 4px;
      font-weight: bold;
    }

    .payment {
      margin-top: 13px;
      color: #cbd5e1;
      font-size: 13px;
    }

    .trade-button {
      width: 100%;
      margin-top: 15px;
      border: none;
      padding: 12px;
      border-radius: 11px;
      font-weight: bold;
      cursor: pointer;
      background: #22c55e;
      color: white;
    }

    .sell-mode .trade-button {
      background: #ef4444;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 500px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: #111827;
      border-top: 1px solid #253047;
      padding: 10px 5px 20px;
      z-index: 20;
    }

    .nav-item {
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
      cursor: pointer;
    }

    .nav-icon {
      font-size: 20px;
      display: block;
      margin-bottom: 4px;
    }

    .nav-item.active {
      color: #60a5fa;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 50;
      align-items: end;
      justify-content: center;
    }

    .modal-box {
      width: 100%;
      max-width: 500px;
      background: #111827;
      padding: 22px;
      border-radius: 24px 24px 0 0;
    }

    .modal-box h2 {
      margin-bottom: 15px;
    }

    .input {
      width: 100%;
      background: #0f172a;
      color: white;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
    }

    .summary {
      background: #0f172a;
      border-radius: 12px;
      padding: 14px;
      margin: 14px 0;
      color: #cbd5e1;
      line-height: 1.7;
    }

    .confirm {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 15px;
    }

    .close {
      margin-top: 10px;
      width: 100%;
      background: transparent;
      color: #94a3b8;
      border: none;
      padding: 10px;
    }
    .order-tabs {
  display: flex;
  background: #111827;
  border: 1px solid #334155;
  border-radius: 12px;
  padding: 4px;
  margin: 15px 0 20px;
  gap: 4px;
}

.order-tab {
  flex: 1;
  padding: 11px 16px;
  border: none;
  border-radius: 9px;
  background: transparent;
  color: #94a3b8;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

.order-tab.active {
  background: #f59e0b;
  color: #111827;
}
  </style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="header-top">

</div>



  <div id="ordersPage" style="display:none;">

   <div class="order-tabs">

  <button class="order-tab" onclick="filterOrders('completed', this)">Completed</button>
</div> 
  <div id="ordersList"></div>
</div>
  <div class="bottom-nav">
  <div class="nav-item active">
    <span class="nav-icon">🏠</span>

  </div>

  <div class="nav-item" onclick="openOrders()">

  <div class="nav-item">
    <span class="nav-icon">💰</span>
    Wallet
  </div>

  <div class="nav-item">
    <span class="nav-icon">👤</span>
    Profile
  </div>
</div>


<div class="modal" id="tradeModal">

</div>


<script>

  let mode = "buy";
  let selectedRate = 155;

    {

    {

  ];


  function renderOffers() {

    const container = document.getElementById("offers");

    const list =
      mode === "buy"
      ? buyOffers
      : sellOffers;

    container.innerHTML = "";

    list.forEach((offer, index) => {

      container.innerHTML += `
        <div class="offer ${mode === "sell" ? "sell-mode" : ""}">

          <div class="seller">

            <div>
              <div class="seller-name">
                ${offer.seller}
                <span class="verified">✓</span>
              </div>

              <div class="trades">
                ${offer.trades}
              </div>
            </div>

          </div>

          <div class="offer-details">

            <div>
              <div class="small-label">Price</div>
              <div class="value">
                ${offer.rate} ETB
              </div>
            </div>

            <div>
              <div class="small-label">Available</div>
              <div class="value">
                ${offer.available}
              </div>
            </div>

            <div>
              <div class="small-label">Limit</div>
              <div class="value">
                ${offer.limit}
              </div>
            </div>

          </div>

          <div class="payment">
            Payment:
            <strong>${offer.payment}</strong>
          </div>

          <button
            class="trade-button"
            onclick="openTrade(${index})"
          >

            ${mode === "buy"
              ? "Buy USDT"
              : "Sell USDT"}

          </button>

        </div>
      `;
    });

  }


  function setMode(newMode) {

    mode = newMode;

    document
      .getElementById("buyTab")
      .classList.toggle(
        "active",
        mode === "buy"
      );

    document
      .getElementById("sellTab")
      .classList.toggle(
        "active",
        mode === "sell"
      );

    renderOffers();
  }
  async function openOrders() {
    const tg = window.Telegram?.WebApp;

    if (!tg || !tg.initData) {
        alert("Please open this app from Telegram");
        return;
    }

    try {
        const response = await fetch(
       "https://bcfaznoplvxxseyiarhe.supabase.co/functions/v1/wallet-action", 
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    initData: tg.initData,
                    type: "list_orders"
                })
            }
        );

        const result = await response.json();

        if (!response.ok) {
            alert("Failed to load orders: " + (result.error || "Unknown error"));
            return;
        }

        console.log("Orders:", result);
      const orders = result.orders || [];

if (orders.length === 0) {
  alert("No orders found.");
  return;
}

const ordersPage = document.getElementById("ordersPage");
const ordersList = document.getElementById("ordersList");
window.allOrders = orders;
ordersList.innerHTML = orders
  .filter(order => ["pending", "ongoing"].includes((order.status || "").toLowerCase()))
  .map(order => {
  return `
   <div onclick="openOrderDetails('${order.id}')" style="
    cursor:pointer;
      background:#111827;
      border:1px solid #334155;
      border-radius:16px;
      padding:16px;
      margin-bottom:12px;
    ">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <strong>${order.type.toUpperCase()}</strong>
        <span>${order.status}</span>
      </div>

        ${order.amount_usdt} USDT
      </div>

      <div style="margin-top:6px;color:#94a3b8;">
        ${order.amount_etb || 0} ETB
      </div>
    </div>
  `;
}).join("");

document.getElementById("homePage").style.display = "none";
      ordersPage.style.display = "block";
    } catch (error) {
        console.error(error);
        alert("Server connection failed.");
    }
}
function filterOrders(type, button) {
 document.querySelectorAll(".order-tab").forEach(btn => {
    btn.style.background = "transparent";
    btn.style.color = "#94a3b8";
});

if (button) {
    button.style.background = "#f59e0b";
    button.style.color = "#111827";
} 
    const orders = window.allOrders || [];

    const filtered = orders.filter(order => {
        const status = String(order.status || "").trim().toLowerCase();

        if (type === "ongoing") {
            return status === "pending" || status === "ongoing";
        }

        if (type === "completed") {
            return status === "completed";
        }

        return true;
    });

    const ordersList = document.getElementById("ordersList");

    ordersList.innerHTML = filtered.map(order => {
  const status = String(order.status || "").trim().toLowerCase();
  const isCompleted = status === "completed";

  const typeLabel = (order.type || order.mode || "ORDER").toUpperCase();
  const orderId = String(order.id || "").slice(0, 8);
  const dateText = order.created_at
    ? new Date(order.created_at).toLocaleDateString("en-GB")
    : "";

  return `
    <div onclick="openOrderDetails('${order.id}')" style="
      background:#1f242c;
      border:1px solid #343b46;
      border-radius:16px;
      padding:10px;
      margin-bottom:10px;
      cursor:pointer;
      color:#f3f4f6;
    ">

      <div style="
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:10px;
        margin-bottom:10px;
      ">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">

          <span style="
            padding:6px 10px;
            border-radius:9px;
            font-size:13px;
            font-weight:700;
            background:${isCompleted ? "#073f34" : "#3f3410"};
            color:${isCompleted ? "#18d89b" : "#ffd633"};
            border:1px solid ${isCompleted ? "#0c765f" : "#6d5a13"};
          ">
            ${isCompleted ? "Completed" : typeLabel}
          </span>

          ${!isCompleted ? `
          <span style="
            padding:6px 10px;
            border-radius:9px;
            font-size:13px;
            font-weight:700;
            background:#3f3410;
            color:#ffd633;
            border:1px solid #6d5a13;
          ">
            ${status === "ongoing" ? "Ongoing" : "Pending Response"}
          </span>
          ` : ""}

        </div>

        <span style="
          color:#667080;
          font-size:30px;
          line-height:1;
        ">›</span>
      </div>

      <div style="
        color:#9aa3b2;
        font-size:14px;
        margin-bottom:18px;
      ">
        Order #${orderId}${dateText ? ` • ${dateText}` : ""}
      </div>

      <div style="
        display:flex;
        justify-content:space-between;
        align-items:flex-end;
        gap:20px;
      ">

        <div>
          <div style="
            color:#9aa3b2;
            font-size:13px;
            margin-bottom:8px;
          ">
            ${isCompleted ? "Trade amount" : "Order amount"}
          </div>

          <div style="
            font-size:16px;
            font-weight:700;
          ">
            ${(order.type || order.mode || "").toUpperCase()}
          </div>
        </div>

        <div style="text-align:right;">
          <div style="
            font-size:20px;
            font-weight:700;
            color:#f8fafc;
          ">
            ${order.amount_usdt || 0} USDT
          </div>

          <div style="
            margin-top:5px;
            color:#9aa3b2;
            font-size:15px;
          ">
            ≈ ${order.amount_etb || 0} ETB
          </div>
        </div>
      </div>

      ${isCompleted ? `
        <div style="
          border-top:1px solid #343b46;
          margin-top:18px;
          padding-top:14px;
          color:#14d89a;
          font-size:15px;
        ">
          ✓ Trade completed successfully
        </div>
      ` : ""}

    </div>
  `;
}).join("");
    if (filtered.length === 0) {
        ordersList.innerHTML = "<div>No orders found.</div>";
    }
}
  function openOrderDetails(orderId) {
    const orders = window.allOrders || [];
    const order = orders.find(o => String(o.id) === String(orderId));

    if (!order) {
        alert("Order not found.");
        return;
    }

    const details = `
Order Details

Type: ${(order.type || "").toUpperCase()}
Status: ${order.status || ""}
Amount: ${order.amount_usdt || 0} USDT
ETB: ${order.amount_etb || 0} ETB
Order ID: ${order.id || ""}
    `;

   const modal = document.createElement("div");

modal.style.cssText = `
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.65);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  padding:20px;
`;

modal.innerHTML = `
  <div style="
    width:100%;
    max-width:380px;
    background:#1f242c;
    border:1px solid #343b46;
    border-radius:16px;
    padding:18px;
    color:#f3f4f6;
  ">

    <div style="
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:18px;
    ">

        <div style="font-size:20px;font-weight:700;">

      </div>

      <div style="
        padding:6px 10px;
        border-radius:8px;
        font-size:13px;
        font-weight:600;
        background:${String(order.status || "").toLowerCase() === "completed" ? "#063f35" : "#4a3b05"};
        color:${String(order.status || "").toLowerCase() === "completed" ? "#19d3a2" : "#ffd633"};
      ">
        ${String(order.status || "Pending")}
      </div>
    </div>

    <div style="
      border-top:1px solid #343b46;
      border-bottom:1px solid #343b46;
      padding:16px 0;
    ">
      <div style="display:flex;justify-content:space-between;margin-bottom:14px;">
        <span style="color:#9aa3b2;">Type</span>
        <strong>${(order.type || order.mode || "").toUpperCase()}</strong>
      </div>

      <div style="display:flex;justify-content:space-between;margin-bottom:14px;">
        <span style="color:#9aa3b2;">Amount</span>
        <strong>${order.amount_usdt || 0} USDT</strong>
      </div>

      <div style="display:flex;justify-content:space-between;">
        <span style="color:#9aa3b2;">ETB Amount</span>
        <strong>${order.amount_etb || 0} ETB</strong>
      </div>
    </div>
<div style="border-top:1px solid #343b46;margin-top:16px;padding-top:14px;color:#22d3a7;font-size:14px;">
  ${isCompleted ? "✓ Trade completed successfully" : "⏳ Waiting for completion"}
</div>
    <button onclick="this.closest('[data-order-modal]').remove()" style="
      width:100%;
      margin-top:18px;
      padding:12px;
      border:0;
      border-radius:10px;
      background:#d88900;
      color:#111827;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
    ">
      Close
    </button>

  </div>
`;
modal.setAttribute("data-order-modal", "");
document.body.appendChild(modal);
}
  function openTrade(index) {

    const offer =
      mode === "buy"
      ? buyOffers[index]
      : sellOffers[index];

    selectedRate = offer.rate;

    document.getElementById("modalTitle")
      .innerText =
      mode === "buy"
      ? "Buy USDT"
      : "Sell USDT";

    document.getElementById("modalRate")
      .innerText =
      offer.rate;

    document.getElementById("modalPayment")
      .innerText =
      offer.payment;

    document.getElementById("amount").value = "";

    document.getElementById("total")
      .innerText = "0";

    document.getElementById("tradeModal")
      .style.display = "flex";
  }


  function closeModal() {
